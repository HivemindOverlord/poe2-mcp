name: CI

on:
  pull_request:
  push:
    branches: [main]

# Minimal token scope: every job here only checks out and reads the repo.
# (Resolves CodeQL "Workflow does not contain permissions".)
permissions:
  contents: read

jobs:
  # ---- Blocking: the hermetic test subset --------------------------------
  # The full suite has ~1100 tests, many needing the network (poe.ninja / PoE
  # API), a live Path of Building, or extracted .datc64 game data — those can't
  # run in CI. This runs the curated CI-safe subset (~468): bridge, installer,
  # and the calculators/knowledge/optimizers/analyzers (in-memory SQLite, mock
  # servers, tmp dirs). Expand via the markers in pyproject as more are tagged.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Run hermetic test subset
        run: >
          python -m pytest tests/ -q -p no:cacheprovider
          -k "pob or bridge or installer or report_error or spirit or stun or resource or calculator
          or knowledge or formula or mechanic or synergy or validation_tools or scor or
          archetype or optimizer or readiness or comparator or schema"

  # ---- Blocking: addon Lua syntax ----------------------------------------
  # The MCP bridge is Lua; a syntax error breaks the addon *silently* (it just
  # fails to load in PoB). luac -p is syntax-only, so PoB-provided globals don't
  # trip it. Catches exactly the class of bug that has bitten this addon before.
  lua-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax-check addon Lua
        run: |
          set -e
          find pob_addon -name '*.lua' -print0 | xargs -0 -I{} luac5.1 -p "{}"
          echo "All addon Lua files are syntactically valid."

  # ---- Blocking: black formatting + isort import order -------------------
  # The codebase is black-clean (#197) and isort-clean, so both are gates.
  # Both are PINNED: black's stable style changes between yearly majors
  # (26.x reformats 25.x-clean code) and isort's sorting can shift between
  # releases, so an unpinned install makes the gate nondeterministic. Bump a
  # pin and reformat in the same PR when adopting a newer version. isort runs
  # with profile=black (pyproject) so the two never fight.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "black==25.11.0" "isort==9.0.2"
      - name: black --check
        run: black --check src/ tests/ scripts/
      - name: isort --check
        run: isort --check-only --profile black src/ tests/ scripts/

  # ---- Advisory: types (non-blocking) ------------------------------------
  # mypy isn't clean yet; run it as a signal. Promote to blocking once
  # worked down.
  advisory:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps + tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt mypy
      - name: mypy (advisory)
        run: mypy src/pob/ src/mcp_server.py
